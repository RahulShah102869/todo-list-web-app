<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="todo-app">
            <h1><i class="fa-solid fa-list-check"></i> To-Do List</h1>

            <!-- Progress Stats -->
            <div class="stat-container">
                <div class="details">
                    <h3>Keep it up!</h3>
                    <div id="progress-bar">
                        <div class="progress" id="progress"></div>
                    </div>
                </div>
                <div class="stats-number" id="numbers">
                    <p>0 / 0</p>
                </div>
            </div>

            <!-- 🔍 SEARCH BAR -->
            <div class="search-area">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Search tasks..." autocomplete="off" />
            </div>

            <!-- ✏️ TASK INPUT + PRIORITY -->
            <form class="input-area" id="task-form">
                <input type="text" id="text-input" placeholder="Add a new task..." autocomplete="off" />

                <select id="priority-input" class="priority-select">
                    <option value="low">🟢 Low</option>
                    <option value="medium" selected>🟡 Medium</option>
                    <option value="high">🔴 High</option>
                </select>

                <button type="submit" id="add-task-btn">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </form>

            <!-- 🎛️ FILTER BUTTONS -->
            <div class="filters">
                <button type="button" class="filter-btn active" data-filter="all">All</button>
                <button type="button" class="filter-btn" data-filter="active">Active</button>
                <button type="button" class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <!-- Task List -->
            <div class="todos-container">
                <div id="empty-state" class="empty-state">
                    <i class="fa-regular fa-face-smile"></i>
                    <p>No tasks yet. Add one above!</p>
                </div>
                <ul id="task-list"></ul>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
